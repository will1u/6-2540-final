<text x="176" y="140" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111111" font-weight="bold">C</text>
<text x="20" y="215" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111111">Q = 1/(ωCR<tspan dy="3" font-size="9">s</tspan><tspan dy="-3">)</tspan></text>
<text x="20" y="231.25" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111111">P = ½ I²R<tspan dy="3" font-size="9">s</tspan><tspan dy="-3">​</tspan></text>
<text x="270" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#777777">lossy dielectric (Si, SiO₂)</text>
