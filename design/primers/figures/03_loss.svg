<text x="20" y="462" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111111">I falls linearly along the rail, so R<tspan dy="3" font-size="9">eff</tspan><tspan dy="-3"> = R/3 and P = V²ω²C²R/6 (Dietl et al., App. A).</tspan></text></svg>
