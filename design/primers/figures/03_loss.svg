<text x="270" y="215" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111111">Q = 1/(p tan δ)</text>
<text x="270" y="231.25" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111111">tan δ (Si, 28 MHz) = 0.274</text>
