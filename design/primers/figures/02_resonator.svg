<text x="350" y="62" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#1f5fa8">W = CV²/2 swaps between C and L</text>
<text x="20" y="262" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111111">ω₀ = 1/√(LC), P = ωCV²/(2Q).  Example C<tspan dy="3" font-size="9">tot</tspan><tspan dy="-3"> = 10 pF, Q = 100: L = 3.23 µH, P = 24.7 mW.</tspan></text>
<text x="20" y="282" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111111">C<tspan dy="3" font-size="9">tot</tspan><tspan dy="-3"> contains the chip (2.59 pF on E2); a 1 pF error shifts the resonance by 1.40 MHz.</tspan></text></svg>
