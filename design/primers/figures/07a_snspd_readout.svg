<text x="20" y="362" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111111">A 1 nF bypass at the pad would low-pass the pulse at 3.18 MHz, close to the A30 corner.</text></svg>
