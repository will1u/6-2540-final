<text x="285" y="180" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" text-anchor="end" fill="#111111" font-weight="bold">C<tspan dy="3" font-size="10">f</tspan><tspan dy="-3">​</tspan></text>
