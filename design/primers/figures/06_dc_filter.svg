<svg xmlns="http://www.w3.org/2000/svg" width="640" height="405" viewBox="0 0 640 405"><rect width="640" height="405" fill="white"/><text x="20" y="28" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">A DC line: filter and RF pickup meet at the electrode</text>
