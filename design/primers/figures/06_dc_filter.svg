<text x="493" y="56" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" text-anchor="start" fill="#111111" font-weight="bold">C<tspan dy="3" font-size="10">c</tspan><tspan dy="-3">​</tspan></text>
<text x="475" y="14" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" fill="#777777">RF rail, V</text>
<text x="20" y="310" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111111">(a) Hold at RF ground: V<tspan dy="3" font-size="9">el</tspan><tspan dy="-3"> = V·C</tspan><tspan dy="3" font-size="9">c</tspan><tspan dy="-3">/(C</tspan><tspan dy="3" font-size="9">c</tspan><tspan dy="-3">+C</tspan><tspan dy="3" font-size="9">f</tspan><tspan dy="-3">+C</tspan><tspan dy="3" font-size="9">g</tspan><tspan dy="-3">).</tspan></text>
<text x="20" y="332" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111111">     C<tspan dy="3" font-size="9">c</tspan><tspan dy="-3"> = 0.414 pF, C</tspan><tspan dy="3" font-size="9">g</tspan><tspan dy="-3"> = 3.21 pF (sim 23): 211.93 mV (100 pF), 21.88 mV (1 nF), 2.20 mV (10 nF).</tspan></text>
<text x="20" y="362" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111111">(b) Cut noise: R and C<tspan dy="3" font-size="9">f</tspan><tspan dy="-3"> low-pass, f</tspan><tspan dy="3" font-size="9">c</tspan><tspan dy="-3"> = 1/(2πRC), τ = RC.</tspan></text>
<text x="20" y="384" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111111">     1 kΩ and 1 nF: 159.15 kHz. The same filter slows the transport waveform.</text></svg>
