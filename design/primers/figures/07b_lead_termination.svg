<text x="20" y="440" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111111">Equal terminations: no current crosses the nanowire. A mismatch sends part of the pickup through it.</text>
<text x="20" y="462" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" text-anchor="start" fill="#111111">Values: I<tspan dy="3" font-size="9">inj</tspan><tspan dy="-3"> = 44.5 µA (E2) / 28.4 µA (E1), L</tspan><tspan dy="3" font-size="9">bond</tspan><tspan dy="-3"> = 2 nH [verify], L</tspan><tspan dy="3" font-size="9">k</tspan><tspan dy="-3"> = 3.10 µH (A30), 5.94 µH (B60).</tspan></text>
<text x="20" y="500" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" fill="#111111" font-weight="bold">Terminations tried: Z<tspan dy="3" font-size="11">term A</tspan><tspan dy="-3"> / Z</tspan><tspan dy="3" font-size="11">term B</tspan><tspan dy="-3">​</tspan></text>
